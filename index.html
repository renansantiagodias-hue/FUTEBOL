
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo do Futebol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Paixão pelo Futebol ⚽</h1>
        <p>Acompanhe momentos e imagens incríveis do esporte!</p>
    </header>

    <main>
        <section class="galeria-container">
            <h2>Galeria de Fotos</h2>
            
            <button id="btn-carregar">Carregar Mais Imagens</button>

            <div id="galeria" class="galeria">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500" alt="Bola de futebol no campo">
                    <p>Campo de Futebol</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?w=500" alt="Chuteira e bola">
                    <p>Hora do Jogo</p>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=500" alt="Estádio lotado">
                    <p>Estádio</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Projeto Futebol</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
